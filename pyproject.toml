[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-curriculos"
version = "1.0.0"
description = "Módulo 2 do ecossistema 'Do diploma ao primeiro emprego': Tutor de currículos"
requires-python = ">=3.10"
dependencies = [
    "carreira-contratos>=1.0,<2",
    "agno==3.2.0",
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
groq = ["groq"]
google = ["google-genai"]
ollama = ["ollama"]
testes = ["pytest", "httpx"]

[project.scripts]
tutor-curriculos = "tutor_curriculos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
